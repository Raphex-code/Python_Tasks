<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student List</title>
  </head>
  <style>
    body{
      background-color: #70eec4e8;
    }
    a{
      text-decoration: none;
      color: #fefcfc;
    }
    button{
      background-color: gray;
      border: none;
      border-radius: 5px;
      padding: 5px;
    }
  </style>
  <body>
    <button><a href="/">Back to Home</a></button>
    <h1>My Students</h1>

    {% for student in students %}
    <div>
      <h2>{{ student.name }}</h2>
      <p>Student ID: {{ student.student_id }}</p>
      <p>Email: {{ student.email }}</p>
      <p>Age: {{ student.age }}</p>
    </div>
    <hr />
    {% empty %}
    <p>No students have been added yet.</p>
    {% endfor %}
  </body>
</html>
